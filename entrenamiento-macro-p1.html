function dasSVG(kind){const W=300,H=220;const L=(x1,y1,x2,y2,col,da="")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2.4" ${da?`stroke-dasharray="${da}"`:""}/>`;
 const P="#5B2A86",O="#E87722";let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Oferta y demanda agregadas"><line x1="30" y1="${H-25}" x2="${W-10}" y2="${H-25}" stroke="currentColor"/><line x1="30" y1="${H-25}" x2="30" y2="10" stroke="currentColor"/><text x="${W-12}" y="${H-8}" font-size="11" text-anchor="end" fill="currentColor">PIB real</text><text x="34" y="16" font-size="11" fill="currentColor">P</text>`;
 const da0=L(60,30,250,180,P),oa0=L(60,170,260,60,O);
 const sh={dl:[L(40,60,200,190,P,"6 4"),"DA1",200,185,P],dr:[L(100,20,280,160,P,"6 4"),"DA1",280,155,P],ol:[L(40,140,230,30,O,"6 4"),"OA1",228,40,O],or:[L(90,190,280,95,O,"6 4"),"OA1",280,108,O]}[kind];
 s+=da0+oa0+sh[0]+`<text x="252" y="190" font-size="11" fill="${P}">DA0</text><text x="262" y="62" font-size="11" fill="${O}">OAcp0</text><text x="${sh[2]}" y="${sh[3]}" font-size="11" text-anchor="end" fill="${sh[4]}">${sh[1]}</text></svg>`;return s}
const GTXT="El gráfico muestra la economía del país de destino antes (curvas 0, continuas) y después (curvas 1, discontinuas) de un cambio. El país importa el petróleo que consume.\n¿Qué noticia es coherente con el gráfico?";
const NOT={dl:"Una recesión en sus principales socios reduce sus exportaciones.",dr:"El gobierno aumenta el gasto en obra pública.",ol:"Sube el precio internacional del petróleo que importan sus empresas.",or:"Una nueva tecnología reduce los costos de producción de sus empresas."};
const MSGN={dl:"Esa noticia reduce la demanda agregada (DA a la izquierda).",dr:"Esa noticia aumenta la demanda agregada (DA a la derecha).",ol:"Esa noticia reduce la oferta agregada (OA a la izquierda).",or:"Esa noticia aumenta la oferta agregada (OA a la derecha)."};
const EXPG={dl:"La DA se desplaza a la izquierda: bajan los precios y la producción.",dr:"La DA se desplaza a la derecha: suben los precios y la producción.",ol:"La OA se desplaza a la izquierda: suben los precios y baja la producción (estanflación).",or:"La OA se desplaza a la derecha: bajan los precios y sube la producción."};
for(const k of ["dl","dr","ol","or"]) add(9,7,"Desplazamientos de la DA y la OA (gráfico)",()=>CON(GTXT,NOT[k],Object.keys(NOT).filter(j=>j!==k).map(j=>[NOT[j],MSGN[j]]),EXPG[k],"DA: Y = C + I + G + XN · OA cp: P sube con Y",dasSVG(k)));
add(9,7,"Choques de oferta y de demanda",()=>CON(`El país de destino importa todo el petróleo que consume. Relacione cada noticia con su efecto de corto plazo.\nNOTICIAS\n1. Sube con fuerza el precio del petróleo.\n2. Una recesión en sus socios reduce sus exportaciones.\n3. Su gobierno aumenta el gasto en infraestructura.\n4. Una nueva tecnología reduce los costos.\nEFECTOS\na) Sube la DA: suben P e Y.\nb) Baja la DA: bajan P e Y.\nc) Baja la OA: sube P y baja Y.\nd) Sube la OA: baja P y sube Y.`,
 "1c, 2b, 3a, 4d",[["1b, 2c, 3a, 4d","El petróleo encarece producir: es un choque de oferta; la recesión externa es de demanda."],["1c, 2d, 3a, 4b","La caída de exportaciones reduce la demanda, no la oferta."],["1a, 2b, 3c, 4d","Para un importador de petróleo, su alza es un choque negativo de oferta."]],
 "Costos (petróleo, tecnología) mueven la OA; componentes del gasto (exportaciones, gasto público) mueven la DA.","DA: C + I + G + XN · OA: costos y productividad"));
add(9,7,"Petróleo en una economía exportadora",()=>CON(`El Ecuador exporta petróleo. Si el precio internacional del crudo sube con fuerza, ¿qué efecto de demanda tiene sobre la economía ecuatoriana en el corto plazo?`,
 "Aumenta la DA, porque suben el valor de las exportaciones y los ingresos del Estado.",[["Reduce la DA, porque encarece los combustibles.","En un exportador neto, el efecto dominante es el mayor ingreso por exportaciones."],["Reduce la OA, como en cualquier país.","En un importador el alza es choque de oferta; aquí la pregunta es por el efecto de demanda de un exportador."],["No tiene efecto, porque el precio lo fija el mercado mundial.","Aunque el precio sea externo, cambia el ingreso del país."]],
 "Para un exportador neto de petróleo, un alza del crudo aumenta XN y el gasto público: la DA se desplaza a la derecha.","DA: C + I + G + XN"));
add(9,7,"Choques simultáneos",()=>CON(`En el mismo año, el gobierno del país de destino aumenta el gasto público y sube el precio de una materia prima que el país importa. Sin conocer el tamaño de cada choque, ¿qué se puede afirmar con certeza?`,
 "Sube el nivel de precios; la producción puede subir o bajar.",[["Suben los precios y la producción.","El choque de oferta reduce la producción: el efecto neto es incierto."],["Baja la producción; los precios pueden subir o bajar.","Los dos choques suben los precios: eso es seguro."],["Sube la producción; los precios pueden subir o bajar.","Los precios suben con certeza; la producción es la incierta."]],
 "DA a la derecha: P↑ Y↑. OA a la izquierda: P↑ Y↓. Seguro: P↑. Incierto: Y.","Combinar los dos desplazamientos"));

add(9,7,"Política fiscal con oferta y demanda agregadas",()=>{const c=pick([0.75,0.8]),dG=R(20,60,10);return CON(`El gobierno del país de destino (PMC = ${fmt(c,2)}) aumenta el gasto en $${dG} millones. Con precios fijos, la producción subiría ${fmt(dG/(1-c))} millones (multiplicador ${fmt(1/(1-c))}). Con una OA de corto plazo de pendiente positiva, ¿qué ocurre?`,
 `La DA se desplaza ${fmt(dG/(1-c))} millones a la derecha, pero la producción sube menos porque también suben los precios.`,[[`La producción sube exactamente ${fmt(dG/(1-c))} millones y los precios no cambian.`,"Eso solo ocurre con OA horizontal (precios fijos)."],["La producción no cambia y solo suben los precios.","Eso ocurre con la OA vertical de largo plazo."],[`La producción sube más de ${fmt(dG/(1-c))} millones porque los precios más altos estimulan el gasto.`,"Un nivel de precios mayor reduce la cantidad demandada de producción, no la aumenta."]],
 "El multiplicador mide el desplazamiento horizontal de la DA; con OA creciente, parte del impulso se va en precios.","ΔDA = k × ΔG · ΔY < k × ΔG si la OA cp tiene pendiente positiva")});

/* ---------- POSICIÓN 10: OA e inflación-desempleo (8) ---------- */
add(10,7,"Oferta agregada de largo plazo",()=>CON(`Complete: «La oferta agregada de largo plazo es ______ porque, cuando precios y salarios se ajustan por completo, la producción depende de ______ y no del ______».`,
 "vertical – los recursos y la tecnología – nivel de precios",[["horizontal – el nivel de precios – gasto planeado","Esa es la OA keynesiana de precios fijos."],["creciente – el nivel de precios – capital","Esa es la OA de corto plazo."],["vertical – la demanda agregada – nivel de precios","La forma es correcta, pero la producción de largo plazo depende de los recursos, no de la demanda."]],
 "En el largo plazo la producción vuelve al PIB potencial, que depende de trabajo, capital, recursos y tecnología.","OA LP: Y = Y potencial"));
add(10,7,"Oferta agregada de corto plazo",()=>CON(`¿Por qué la oferta agregada de corto plazo tiene pendiente positiva?`,
 "Porque los salarios y algunos costos tardan en ajustarse: si suben los precios, producir más se vuelve rentable.",[["Porque los consumidores compran más cuando suben los precios.","Eso describe a los consumidores (demanda), y además al revés."],["Porque en el corto plazo la producción está fija en el PIB potencial.","Eso describe la OA de largo plazo (vertical)."],["Porque el gobierno fija los precios.","La pendiente se explica por costos rígidos, no por control de precios."]],
 "Con salarios rígidos, un nivel de precios mayor aumenta los márgenes y las empresas producen más.","OA cp: P = P₀ + sY"));
add(10,7,"Relación entre inflación y desempleo",()=>CON(`Un analista afirma: «cuando baja el desempleo, siempre sube la inflación; basta el desempleo para predecir la inflación».\n¿Qué evaluación es más sólida?`,
 "Es débil: un choque de oferta puede subir a la vez la inflación y el desempleo.",[["Es correcta: la curva de Phillips se cumple en todos los países y periodos.","Es una regularidad de corto plazo ante choques de demanda, no una ley."],["Es incorrecta: inflación y desempleo nunca se relacionan.","La relación inversa sí aparece en ciertos periodos."],["Es correcta: con menos desempleo cae la producción y suben los precios.","Menos desempleo significa más producción, no menos."]],
 "La relación inversa aparece con choques de demanda; con choques de oferta (estanflación) suben los dos.","Choque de demanda: P e Y en la misma dirección"));
add(10,7,"OA clásica y keynesiana",()=>CON(`Relacione cada forma de la oferta agregada con su enfoque.\nFORMAS\n1. Vertical en el PIB potencial.\n2. Horizontal a un nivel de precios fijo.\n3. Con pendiente positiva.\nENFOQUES\na) Clásico (largo plazo)\nb) Keynesiano (precios rígidos)\nc) Corto plazo intermedio`,
 "1a, 2b, 3c",[["1b, 2a, 3c","La OA vertical es clásica; la horizontal, keynesiana."],["1a, 2c, 3b","La OA horizontal corresponde a precios totalmente rígidos (keynesiano)."],["1c, 2b, 3a","La OA vertical corresponde al ajuste completo de precios (clásico)."]],
 "Clásico: vertical. Keynesiano: horizontal. Corto plazo: pendiente positiva.","OA LP vertical · OA keynesiana horizontal · OA cp creciente"));
add(10,7,"Largo plazo tras un choque de demanda",()=>CON(`La DA del país de destino aumenta y, en el corto plazo, suben los precios y la producción. ¿Qué ocurre en el largo plazo, cuando los salarios se ajustan?`,
 "La producción vuelve al PIB potencial y los precios quedan más altos.",[["La producción queda más alta de forma permanente.","En el largo plazo la OA es vertical: la DA solo cambia precios."],["Los precios vuelven al nivel inicial.","El ajuste de salarios eleva costos: los precios quedan más altos."],["La producción y los precios vuelven al punto inicial.","La DA siguió más alta: el nivel de precios es mayor."]],
 "Con salarios flexibles en el largo plazo, la OA cp se desplaza hasta que Y = potencial: solo queda el efecto en precios.","OA LP: Y = Y potencial"));
add(10,7,"Brecha recesiva",()=>{const Yp=R(900,1200,50),Y=Yp-R(50,150,10);return CON(`El PIB potencial del país de destino es $${fmt(Yp)} millones y el de equilibrio de corto plazo, $${fmt(Y)} millones (datos hipotéticos).\n¿Qué describe esta situación?`,
 `Una brecha recesiva de $${fmt(Yp-Y)} millones, con desempleo mayor que la tasa natural.`,[[`Una brecha inflacionaria de $${fmt(Yp-Y)} millones.`,"La producción está por debajo del potencial: la brecha es recesiva."],["Pleno empleo, porque hay equilibrio.","Puede haber equilibrio de corto plazo sin pleno empleo."],["Una estanflación.","La estanflación combina precios en alza y caída de la producción; aquí solo se compara Y con el potencial."]],
 `Y < Y potencial: brecha recesiva de ${fmt(Yp-Y)}. El desempleo cíclico es positivo.`,"Brecha = Y − Y potencial")});
add(10,7,"Estanflación",()=>CON(`¿Qué tipo de choque produce a la vez más inflación y más desempleo?`,
 "Un choque negativo de oferta, como un alza fuerte del costo de un insumo importado.",[["Un aumento del gasto público.","Sube la DA: suben precios y producción, baja el desempleo."],["Una caída de las exportaciones.","Baja la DA: bajan precios y producción."],["Una mejora tecnológica.","Sube la OA: bajan los precios y sube la producción."]],
 "La OA se desplaza a la izquierda: P↑ e Y↓ (más desempleo). Por eso la relación inversa inflación-desempleo no es fija.","Choque de oferta: P e Y en direcciones opuestas"));
add(10,7,"Leer datos de inflación y desempleo",()=>{const u1=R(4,5,0.1),u2=+(u1+R(1,2,0.1)).toFixed(1),i1=R(2,3,0.1),i2=+(i1+R(3,5,0.1)).toFixed(1);return CON(`En el país de destino, de un año a otro, el desempleo pasó de ${p(u1,1)} a ${p(u2,1)} y la inflación de ${p(i1,1)} a ${p(i2,1)} (datos hipotéticos).\n¿Qué explicación es más coherente?`,
 "Un choque negativo de oferta, como el alza de un insumo importado.",[["Un aumento de la demanda agregada.","Con más DA, el desempleo bajaría."],["Una caída de la demanda agregada.","Con menos DA, la inflación bajaría."],["Una mejora de la productividad.","La OA subiría: bajarían la inflación y el desempleo."]],
 "Inflación y desempleo suben juntos: es la señal de un choque de oferta negativo (estanflación).","Choque de oferta: P↑ Y↓")});

if(typeof module!=="undefined")module.exports={C,SLOTS,TEMAS,REPASO,fmt,near};

</script>
<script>
{
const KEY="macroP1_entrenamiento_v1";
let S={nombre:"",curso:"",hist:[],cur:null};
try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCD";
function gen(c){let q=null,t=0;while(!q&&t<200){q=c.gen();t++}q.tema=c.tema;q.sub=c.sub;q.slot=c.slot;return q}
C.forEach(c=>{c.calc=!!gen(c).num});
function newAttempt(){const qs=SLOTS.map(s=>{const pool=C.filter(c=>c.slot===s.n&&(s.n<2||s.n>4||c.calc));return gen(pick(pool))});S.cur={qs,i:0,ans:qs.map(()=>({num:null,choice:null,numDone:false})),start:new Date().toISOString()};save();render()}
function parseNum(v){let s=String(v).trim().replace(/[\s$% ]/g,"").replace(/−/g,"-");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const x=parseFloat(s);return isFinite(x)?x:null}
const fdate=iso=>{const d=new Date(iso);return d.toLocaleDateString("es-EC")+" "+d.toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"})};

function home(){
 const h=S.hist;
 app.innerHTML=`<div class="card"><h2>Tus datos</h2><p class="mut">Solo se usan para tu PDF. Se guardan en este navegador.</p>
 <label for="nom">Nombre y apellido</label><input id="nom" value="${esc(S.nombre)}" autocomplete="name">
 <label for="cur">Curso y paralelo</label><input id="cur" value="${esc(S.curso)}" placeholder="Ej.: Macroeconomía, 4.º nivel">
 </div>
 <div class="card"><h2>¿Qué quieres hacer?</h2>
 <p><b>Intento de 10 preguntas.</b> Una de cada bloque del parcial; siempre hay ejercicios de PIB y deflactor, desempleo, e IPC e inflación. Ves la retroalimentación y tu nota al final.</p>
 <div class="row"><button class="b1" id="go">${S.cur?"Continuar mi intento":"Empezar un intento"}</button></div>
 <p style="margin-top:18px"><b>Practicar un tema.</b> Preguntas sin límite del tema que elijas, con retroalimentación inmediata.</p>
 <label for="tem">Tema</label><select id="tem">${Object.entries(TEMAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <div class="row"><button class="b2" id="pr">Practicar este tema</button></div></div>
 <div class="card"><h2>Mi registro</h2>${h.length?`<table><tr><th>Intento</th><th>Fecha</th><th class="n">Nota</th></tr>${h.map((a,i)=>`<tr><td>${i+1}</td><td>${fdate(a.fecha)}</td><td class="n">${fmt(a.nota,1)} / 10</td></tr>`).join("")}</table>${refuerzo()}`:`<p class="mut">Todavía no tienes intentos terminados.</p>`}
 <div class="row"><button class="b3" id="pdf" ${h.length?"":"disabled"}>Descargar mi PDF</button></div><p class="mut" id="pmsg"></p></div>`;
 const keep=()=>{S.nombre=document.getElementById("nom").value.trim();S.curso=document.getElementById("cur").value.trim();save()};
 document.getElementById("nom").oninput=keep;document.getElementById("cur").oninput=keep;
 document.getElementById("go").onclick=()=>{keep();if(!S.nombre){alertBox("Escribe tu nombre para empezar.");return}S.cur?render():newAttempt()};
 document.getElementById("pr").onclick=()=>{keep();P={tema:+document.getElementById("tem").value,q:null,n:0,ok:0};nextPractice()};
 document.getElementById("pdf").onclick=()=>{keep();makePDF()};
}
function alertBox(t){const m=document.getElementById("pmsg")||document.createElement("p");m.textContent=t;m.className="mut";m.style.color="var(--bad)";if(!m.isConnected)app.querySelector(".card").appendChild(m)}
function temaStats(){const st={};for(const a of S.hist)for(const [t,[o,n]] of Object.entries(a.porTema)){st[t]=st[t]||[0,0];st[t][0]+=o;st[t][1]+=n}return st}
function refuerzo(){const st=temaStats();const w=Object.entries(st).filter(([t,[o,n]])=>n&&o/n<0.7).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
 return w.length?`<h3>Temas para reforzar</h3><ul>${w.map(([t,[o,n]])=>`<li>${TEMAS[t]}: ${o} de ${n} correctas. Repasa: ${REPASO[t]}.</li>`).join("")}</ul>`:`<p class="mut">Vas bien en todos los temas que has practicado.</p>`}

/* ---------- pregunta ---------- */
function qHTML(q,a,mode){
 const showOpts=!q.num||a.numDone;
 let h=`<p class="q">${esc(q.q)}</p>${q.svg?`<div class="fig">${q.svg}</div>`:""}
 <button class="info" data-f>(i) Fórmula</button><div class="formula hide" id="fx">${esc(q.f)}</div>`;
 if(q.num){h+=`<div class="numbox"><label for="nv">1. Calcula y escribe tu resultado${q.num.unit?" ("+q.num.unit+")":""}</label><p class="mut" style="margin:0">Usa coma para los decimales, sin separador de miles.</p>
 <div class="row"><input id="nv" inputmode="decimal" value="${a.num??""}" ${a.numDone?"disabled":""}><button class="b1" id="nb" ${a.numDone?"disabled":""}>Registrar</button><button class="b3" id="nx" ${a.numDone?"disabled":""}>No lo sé</button></div><div id="nfb">${a.numDone&&mode==="p"?numFB(q,a):""}</div></div>`}
 if(showOpts)h+=`<p><b>${q.num?"2. Ahora elige la opción correcta":"Elige la opción correcta"}</b></p>`+q.opts.map((o,j)=>`<button class="opt ${a.choice===j?"sel":""}" data-o="${j}"><b>${L[j]})</b>${esc(o.t)}</button>`).join("");
 return h}
function numFB(q,a){if(a.num===null)return `<p class="mut">Sin resultado registrado.</p>`;const ok=near(a.num,q.num.ans,q.num.dec);return `<p style="color:var(${ok?"--ok":"--bad"})"><b>${ok?"Tu resultado coincide.":"Tu resultado no coincide."}</b> ${ok?"":"Revisa el procedimiento al ver la retroalimentación."}</p>`}
function fbHTML(q,a){const o=q.opts[a.choice],c=q.opts.findIndex(x=>x.ok);
 return `<div class="fb ${o&&o.ok?"":"no"}">${o?(o.ok?`<p><b>Correcto.</b></p>`:`<p><b>Incorrecto.</b> ${esc(o.msg)}</p>`):`<p><b>Sin responder.</b></p>`}
 ${o&&o.ok?"":`<p><b>Respuesta correcta:</b> ${L[c]}) ${esc(q.opts[c].t)}</p>`}<p>${esc(q.exp)}</p><p class="mut">Repasa: ${REPASO[q.tema]}.</p></div>`}
function wire(q,a,onNum,onOpt){
 app.querySelector("[data-f]").onclick=()=>document.getElementById("fx").classList.toggle("hide");
 if(q.num&&!a.numDone){const reg=v=>{a.num=v;a.numDone=true;onNum()};
  document.getElementById("nb").onclick=()=>{const v=parseNum(document.getElementById("nv").value);if(v===null){document.getElementById("nfb").innerHTML=`<p class="mut">Escribe un número, o pulsa «No lo sé».</p>`;return}reg(v)};
  document.getElementById("nx").onclick=()=>reg(null)}
 app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>onOpt(+b.dataset.o))}

function render(){const A=S.cur;if(!A)return home();if(A.i>=A.qs.length)return finish();
 const q=A.qs[A.i],a=A.ans[A.i];
 app.innerHTML=`<div class="card"><span class="chip">${TEMAS[q.tema]}</span> <span class="mut">Pregunta ${A.i+1} de ${A.qs.length}</span><div class="prog"><i style="width:${A.i/A.qs.length*100}%"></i></div>${qHTML(q,a,"i")}
 <div class="row"><button class="b3" id="bk" ${A.i?"":"disabled"}>Anterior</button><button class="b1" id="nxq" ${a.choice===null?"disabled":""}>${A.i===A.qs.length-1?"Terminar y ver mi nota":"Siguiente"}</button></div>
 <div class="row"><button class="b3" id="out">Guardar y salir</button></div></div>`;
 wire(q,a,()=>{save();render()},j=>{a.choice=j;save();render()});
 document.getElementById("bk").onclick=()=>{A.i--;save();render()};
 document.getElementById("nxq").onclick=()=>{A.i++;save();render();scrollTo(0,0)};
 document.getElementById("out").onclick=()=>{save();home()}}

function finish(){const A=S.cur;const porTema={};let ok=0;const err=[];
 A.qs.forEach((q,i)=>{const a=A.ans[i],o=q.opts[a.choice],good=!!(o&&o.ok);ok+=good;porTema[q.tema]=porTema[q.tema]||[0,0];porTema[q.tema][0]+=good;porTema[q.tema][1]++;if(!good)err.push({n:i+1,tema:q.tema,sub:q.sub,msg:o?o.msg:"Sin responder."})});
 const rec={fecha:new Date().toISOString(),nota:ok,aciertos:ok,total:A.qs.length,porTema,err,qs:A.qs,ans:A.ans};
 S.hist.push(rec);S.cur=null;save();results(S.hist.length-1)}

function results(k){const r=S.hist[k];
 app.innerHTML=`<div class="card"><h2>Tu nota de práctica</h2><div class="big">${fmt(r.nota,1)}<span style="font-size:.4em;color:var(--mut)"> / 10</span></div>
 <p>Respondiste bien ${r.aciertos} de ${r.total} preguntas. ${r.nota>=7?"Buen resultado: sigue practicando para afianzarlo.":"Revisa los errores de abajo y vuelve a intentarlo: cada intento trae preguntas distintas."}</p>
 <h3>Por tema</h3>${Object.entries(r.porTema).map(([t,[o,n]])=>`<div class="bar"><span>${TEMAS[t]}</span><span>${o} de ${n}</span><div class="t"><i style="width:${o/n*100}%"></i></div></div>`).join("")}
 ${r.err.length?`<h3>Por qué perdiste puntos</h3><ul>${r.err.map(e=>`<li><b>Pregunta ${e.n} (${esc(e.sub)}):</b> ${esc(e.msg)}</li>`).join("")}</ul>`:"<p><b>¡Todas correctas!</b></p>"}
 <div class="row"><button class="b1" id="again">Nuevo intento</button><button class="b3" id="hm">Inicio y PDF</button></div></div>
 <div class="card"><h2>Revisión de cada pregunta</h2>${r.qs.map((q,i)=>{const a=r.ans[i],o=q.opts[a.choice];return `<details ${o&&o.ok?"":"open"}><summary>${i+1}. ${esc(q.sub)} · ${o&&o.ok?"✔ correcta":"✘ incorrecta"}</summary><p class="q">${esc(q.q)}</p>${q.svg?`<div class="fig">${q.svg}</div>`:""}${q.num?numFB(q,a):""}${q.opts.map((x,j)=>`<div class="opt ${x.ok?"good":(a.choice===j?"wrong":"")}"><b>${L[j]})</b>${esc(x.t)}</div>`).join("")}${fbHTML(q,a)}<p class="mut">Fórmula: ${esc(q.f)}</p></details>`}).join("")}</div>`;
 document.getElementById("again").onclick=()=>{newAttempt();scrollTo(0,0)};document.getElementById("hm").onclick=()=>{home();scrollTo(0,0)}}

/* ---------- práctica por tema ---------- */
let P=null;
function nextPractice(){const pool=C.filter(c=>c.tema===P.tema);P.q=gen(pick(pool));P.a={num:null,choice:null,numDone:false};P.done=false;showPractice();scrollTo(0,0)}
function showPractice(){const q=P.q,a=P.a;
 app.innerHTML=`<div class="card"><span class="chip">Práctica · ${TEMAS[P.tema]}</span> <span class="mut">Llevas ${P.ok} de ${P.n} correctas</span>${qHTML(q,a,"p").replace(/<button class="opt/g,P.done?'<button disabled class="opt':'<button class="opt')}
 <div id="pf">${P.done?fbHTML(q,a):""}</div>
 <div class="row">${P.done?`<button class="b1" id="pn">Otra pregunta</button>`:""}<button class="b3" id="ph">Volver al inicio</button></div></div>`;
 if(P.done){app.querySelectorAll("[data-o]").forEach((b,j)=>{const o=q.opts[j];if(o.ok)b.classList.add("good");else if(a.choice===j)b.classList.add("wrong")})}

/* ---------- PDF ---------- */
const clean=s=>String(s).replace(/ /g," ").replace(/−/g,"-").replace(/÷/g,"/").replace(/Δ/g,"var. ").replace(/≈/g,"aprox.").replace(/[₀₁₂ₜ]/g,m=>({"₀":"0","₁":"1","₂":"2","ₜ":"t"}[m])).replace(/[↑]/g," sube").replace(/[↓]/g," baja").replace(/→/g,"->").replace(/[✔✘]/g,"").replace(/Σ/g,"suma de ").replace(/π/g,"inflación ");
function makePDF(){const msg=document.getElementById("pmsg");
 if(!window.jspdf){msg.textContent="No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a intentarlo.";return}
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"});let y=18;const W=180;
 const line=(t,o={})=>{d.setFont("helvetica",o.b?"bold":"normal");d.setFontSize(o.s||10.5);const ls=d.splitTextToSize(clean(t),W);for(const l of ls){if(y>282){d.addPage();y=18}d.text(l,15,y);y+=(o.s||10.5)*0.45}y+=o.gap??1.5};
 d.setFillColor(91,42,134);d.rect(0,0,210,10,"F");
 line("Entrenamiento para el Parcial 1 · Macroeconomía",{b:1,s:15,gap:3});
 line(`Estudiante: ${S.nombre||"(sin nombre)"}`);line(`Curso: ${S.curso||"(sin curso)"}`);line(`Fecha de descarga: ${fdate(new Date().toISOString())}`,{gap:2});
 line("Nota de práctica: no cuenta para la calificación. Sirve para identificar qué temas reforzar antes de la prueba.",{s:9.5,gap:4});
 line("Intentos",{b:1,s:12});S.hist.forEach((a,i)=>line(`Intento ${i+1} · ${fdate(a.fecha)} · Nota: ${fmt(a.nota,1)} / 10 (${a.aciertos} de ${a.total})`));
 y+=2;line("Aciertos acumulados por tema",{b:1,s:12});const st=temaStats();for(const [t,[o,n]] of Object.entries(st))line(`${TEMAS[t]}: ${o} de ${n} (${fmt(o/n*100,0)} %)`);
 y+=2;line("Temas para reforzar",{b:1,s:12});const w=Object.entries(st).filter(([t,[o,n]])=>o/n<0.7);if(w.length)w.forEach(([t])=>line(`${TEMAS[t]}. Repasar: ${REPASO[t]}.`));else line("Ninguno: más de 70 % de aciertos en todos los temas practicados.");
 const r=S.hist[S.hist.length-1];y+=2;line(`Detalle del último intento (nota ${fmt(r.nota,1)} / 10)`,{b:1,s:12});
 r.qs.forEach((q,i)=>{const a=r.ans[i],o=q.opts[a.choice];line(`${i+1}. ${TEMAS[q.tema]} - ${q.sub}: ${o&&o.ok?"correcta":"incorrecta"}`,{b:1,s:10});if(!(o&&o.ok)){line(`Error: ${o?o.msg:"sin responder"}`,{s:9.5,gap:0.5});line(`Explicación: ${q.exp}`,{s:9.5})}});
 const n=(S.nombre||"estudiante").replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,"").trim().replace(/\s+/g,"_");
 try{d.save(`Entrenamiento_Macro_P1_${n}.pdf`);msg.textContent="PDF descargado."}catch(e){msg.textContent="Este visor no permite descargas. Abre el enlace en tu navegador."}}

render();
}
