const rnd=Math.random;
const R=(a,b,s=1)=>{const k=Math.round((b-a)/s);return +(a+s*Math.floor(rnd()*(k+1))).toFixed(6)};
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fmt(x,d=0){if(!isFinite(x))return "—";const neg=x<0;x=Math.abs(x);let s=x.toFixed(d);let [i,f]=s.split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g," ");return (neg?"−":"")+i+(f?","+f:"")}
const $=(x,d=0)=>(x<0?"−$":"$")+fmt(Math.abs(x),d);
const near=(a,b,d)=>Math.abs(a-b)<=Math.max(Math.pow(10,-d)*1.01,Math.abs(b)*0.01);
function NUM(o){
 const d=o.dec??0, show=o.show||(v=>fmt(v,d));
 const ok=+o.ans.toFixed(d);
 const ds=[];
 for(const e of o.errs){const v=+e.v.toFixed(d); if(!isFinite(v)||v<0)continue; if(near(v,ok,d))continue; if(ds.some(x=>near(x.v,v,d)))continue; ds.push({v,msg:e.msg}); if(ds.length===3)break;}
 if(ds.length<3) return null;
 const opts=[{v:ok,ok:true,msg:""},...ds].sort((a,b)=>a.v-b.v).map(x=>({t:show(x.v),ok:x.ok||false,msg:x.msg}));
 return {tipo:"calc",q:o.q,opts,num:{ans:ok,dec:d,unit:o.unit||""},exp:o.exp,f:o.f,svg:o.svg};
}
function CON(q,ok,ds,exp,f,svg){
 return {tipo:"con",q,opts:shuffle([{t:ok,ok:true,msg:""},...ds.map(x=>({t:x[0],ok:false,msg:x[1]}))]),exp,f,svg};
}

function fpp(ctx){const s=pick([5,10,20]);const d=[R(2,8,1)];for(const k of [3,3,4])d.push(d[d.length-1]+R(k,k+8,1));const ym=d.reduce((a,b)=>a+b,0);
 const xs=[0,s,2*s,3*s,4*s],ys=[ym];d.forEach(v=>ys.push(ys[ys.length-1]-v));const L="ABCDE";
 return {...ctx,s,d,xs,ys,L,tab:xs.map((x,i)=>`Punto ${L[i]}: ${x} ${ctx.x} y ${ys[i]} ${ctx.y}`).join("\n"),corta:xs.map((x,i)=>`${L[i]}: ${x} y ${ys[i]}`).join("; ")}}
function fppSVG(F,pts,F2){const W=320,H=240,x0=44,y0=H-34;const mx=Math.max(F.xs[4],F2?F2.xs[4]:0)*1.12,my=Math.max(F.ys[0],F2?F2.ys[0]:0)*1.12;
 const X=v=>(x0+v/mx*(W-x0-12)).toFixed(1),Y=v=>(y0-v/my*(y0-14)).toFixed(1);
 const line=(G,col,da)=>`<polyline fill="none" stroke="${col}" stroke-width="2.4" ${da?'stroke-dasharray="6 4"':""} points="${G.xs.map((x,i)=>X(x)+","+Y(G.ys[i])).join(" ")}"/>`;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frontera de posibilidades de producción"><line x1="${x0}" y1="${y0}" x2="${W-6}" y2="${y0}" stroke="currentColor"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="6" stroke="currentColor"/>`;
 s+=`<text x="${W-6}" y="${H-4}" font-size="11" text-anchor="end" fill="currentColor">${F.x[0].toUpperCase()+F.x.slice(1)}</text><text x="${x0+4}" y="12" font-size="11" fill="currentColor">${F.y[0].toUpperCase()+F.y.slice(1)}</text>`;
 if(!F2){F.xs.forEach(x=>s+=`<text x="${X(x)}" y="${y0+13}" font-size="10" text-anchor="middle" fill="currentColor">${x}</text>`);let ly=-99;F.ys.forEach(y=>{if(y>0&&Math.abs(+Y(y)-ly)>=11){ly=+Y(y);s+=`<text x="${x0-4}" y="${+Y(y)+3}" font-size="10" text-anchor="end" fill="currentColor">${y}</text>`}})}
 s+=line(F,"#5B2A86");
 if(F2){s+=line(F2,"#E87722",1)+`<text x="${W-8}" y="24" font-size="11" text-anchor="end" fill="#5B2A86">— Frontera inicial</text><text x="${W-8}" y="38" font-size="11" text-anchor="end" fill="#E87722">- - Frontera final</text>`}
 (pts||[]).forEach(p=>s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="#E87722"/><text x="${+X(p.x)+7}" y="${+Y(p.y)-6}" font-size="13" font-weight="700" fill="currentColor">${p.n}</text>`);
 return s+"</svg>"}


const FF="Costo de oportunidad por unidad = unidades del otro bien a las que se renuncia ÷ unidades que se ganan del bien que aumenta";
const QF=[
 F=>{const i=Math.floor(rnd()*4),j=i+1,dy=F.d[i];const o=i<3?F.d[i+1]:F.d[i-1];
  return NUM({q:`${F.who}\nLa tabla muestra las combinaciones máximas que puede producir en un mes:\n${F.tab}\nAl pasar del punto ${F.L[i]} al punto ${F.L[j]}, ¿cuál es el costo de oportunidad de cada unidad adicional de ${F.sx}, medido en ${F.y}?`,ans:dy/F.s,dec:2,
  errs:[{v:F.s/dy,msg:`Dividiste al revés: ese es el costo de una unidad de ${F.sy}, medido en ${F.x}.`},{v:dy,msg:`Ese es el sacrificio total de las ${F.s} unidades, no el de cada una.`},{v:o/F.s,msg:"Usaste otro tramo de la tabla: fíjate en los dos puntos que pide la pregunta."},{v:F.ys[j]/F.xs[j],msg:"Dividiste las cantidades del punto final: el costo de oportunidad compara los cambios entre dos puntos."}],
  unit:F.y,exp:`De ${F.L[i]} a ${F.L[j]} se ganan ${F.s} ${F.x} y se pierden ${F.ys[i]} − ${F.ys[j]} = ${dy} ${F.y}. Costo por unidad: ${dy} ÷ ${F.s} = ${fmt(dy/F.s,2)}.`,f:FF})},
 F=>{const i=Math.floor(rnd()*3),j=i+2,dy=F.ys[i]-F.ys[j],dx=F.xs[j]-F.xs[i];
  return NUM({q:`${F.who}\nLa tabla muestra las combinaciones máximas que puede producir en un mes:\n${F.tab}\nUn cliente pide más ${F.sx} y la gerencia evalúa pasar del punto ${F.L[i]} al punto ${F.L[j]}. ¿Cuál es el costo de oportunidad de cada unidad adicional de ${F.sx}, medido en ${F.y}?`,ans:dy/dx,dec:2,
  errs:[{v:dx/dy,msg:"Dividiste al revés: pusiste las unidades que se ganan sobre las que se pierden."},{v:dy,msg:`Ese es el sacrificio total de las ${dx} unidades, no el de cada una.`},{v:F.d[i]/F.s,msg:"Usaste solo el primer tramo: el movimiento va de un punto a otro que está dos filas más abajo."},{v:F.d[i+1]/F.s,msg:"Usaste solo el segundo tramo: hay que tomar todo el movimiento entre los dos puntos."}],
  unit:F.y,exp:`De ${F.L[i]} a ${F.L[j]} se ganan ${dx} ${F.x} y se pierden ${F.ys[i]} − ${F.ys[j]} = ${dy} ${F.y}. Costo por unidad: ${dy} ÷ ${dx} = ${fmt(dy/dx,2)}.`,f:FF})},
 F=>{const i=Math.floor(rnd()*4),j=i+1,dy=F.d[i];const o=i<3?F.d[i+1]:F.d[i-1];
  return NUM({q:`${F.who}\nLa tabla muestra las combinaciones máximas que puede producir en un mes:\n${F.tab}\nHoy produce en el punto ${F.L[j]}, pero un cliente pide más ${F.sy} y la gerencia evalúa volver al punto ${F.L[i]}. ¿Cuál es el costo de oportunidad de cada unidad adicional de ${F.sy}, medido en ${F.x}?`,ans:F.s/dy,dec:2,
  errs:[{v:dy/F.s,msg:`Ese es el costo de una unidad de ${F.sx}, medido en ${F.y}: aquí se pregunta por el otro bien.`},{v:F.s,msg:`Ese es el sacrificio total de ${F.x}, no el de cada unidad de ${F.sy}.`},{v:F.s/o,msg:"Usaste otro tramo de la tabla."},{v:F.xs[j]/F.ys[j],msg:"Dividiste las cantidades de un punto: hay que comparar los cambios entre los dos puntos."}],
  unit:F.x,exp:`De ${F.L[j]} a ${F.L[i]} se ganan ${dy} ${F.y} y se pierden ${F.s} ${F.x}. Costo por unidad de ${F.sy}: ${F.s} ÷ ${dy} = ${fmt(F.s/dy,2)}. Es el inverso del costo del otro bien.`,f:"Costo de oportunidad por unidad = unidades del otro bien a las que se renuncia ÷ unidades que se ganan del bien que aumenta"})},
 F=>{const k=2+Math.floor(rnd()*3),dy=F.ys[0]-F.ys[k];
  return NUM({q:`${F.who}\nLa tabla muestra las combinaciones máximas que puede producir en un mes:\n${F.tab}\nSi pasa del punto A al punto ${F.L[k]}, ¿a cuántas unidades de ${F.sy} renuncia en total?`,ans:dy,dec:0,
  errs:[{v:F.xs[k],msg:`Esa es la cantidad de ${F.x} que gana, no lo que sacrifica.`},{v:F.ys[k],msg:`Esa es la producción de ${F.sy} que le queda en el punto ${F.L[k]}, no la que sacrifica.`},{v:F.ys[0],msg:"Ese es el máximo posible: solo renunciaría a todo si llegara al último punto."},{v:F.d[k-1],msg:"Tomaste solo el último tramo: hay que contar desde el punto A."}],
  unit:F.y,exp:`Renuncia a ${F.ys[0]} − ${F.ys[k]} = ${dy} ${F.y} para ganar ${F.xs[k]} ${F.x}.`,f:"Sacrificio total = producción del bien que se reduce en el punto inicial − su producción en el punto final"})}];

const PT={E:"Eficiente: está sobre la frontera y no se puede producir más de un bien sin producir menos del otro.",I:"Ineficiente: está dentro de la frontera; hay recursos sin usar o mal usados.",N:"Inalcanzable: está fuera de la frontera; no se puede producir con los recursos y la tecnología actuales.",O:"Óptimo: es el mejor punto posible para la empresa."};
function ptOf(F,type){const i=1+Math.floor(rnd()*3),x=F.xs[i],yf=F.ys[i];let y=yf;if(type==="I")y=Math.max(1,yf-Math.max(2,Math.round(yf*R(0.25,0.5,0.05))));if(type==="N")y=yf+Math.max(3,Math.round(F.ys[0]*R(0.15,0.3,0.05)));return {x,y,yf}}

const TEMAS={1:"Fundamentos de la economía",2:"Costo de oportunidad",3:"Agentes y flujo circular",4:"Frontera de posibilidades de producción",5:"Teoría de la utilidad",6:"Mercado: tipos, demanda y oferta",7:"Equilibrio y sus cambios"};

 {n:1,lab:"Fundamentos"},{n:2,lab:"Ejercicio de costo de oportunidad"},{n:3,lab:"Agentes y mercados del flujo circular"},{n:4,lab:"Flujo circular aplicado"},

[["Una startup de Quito tiene $20 000 de presupuesto de marketing para el año y quiere pautar en redes, asistir a ferias y anunciar en radio, lo que costaría $35 000.","el presupuesto no alcanza"],

 `Escasez: ${r} para todo lo que se desea.`,
 [["Inflación: los precios de casi todos los bienes suben de forma generalizada.","El caso no habla de precios: el problema es que los recursos no alcanzan."],["Desempleo: hay recursos disponibles que se quedan sin usar en la producción.","Al contrario: los recursos se usan y aun así no alcanzan."],["Falta de información: no se conoce cuánto cuesta cada opción.","Aunque se conocieran todos los costos, los recursos seguirían sin alcanzar."]],
 "La escasez es la situación en la que los recursos son limitados frente a lo que se desea. Obliga a elegir, y cada elección tiene un costo de oportunidad.",

add(1,1,"Economía positiva y normativa",()=>CON(`El equipo de inteligencia de negocios de una cadena de ferreterías revisa estas afirmaciones.\n¿Cuáles son afirmaciones de economía positiva?\n1. Cuando subimos 5 % el precio del cemento, las ventas cayeron 8 %.\n2. Deberíamos abrir los domingos para atender mejor a los clientes.\n3. Si sube el ingreso de los hogares, aumentan las compras de materiales de construcción.\n4. Es injusto que los proveedores cobren distinto a las ferreterías pequeñas.\n5. Las ventas de pintura aumentan cada diciembre.`,
 "1, 3 y 5",[["1, 2 y 3","La afirmación 2 dice qué se debería hacer: es normativa."],["2, 4 y 5","Las afirmaciones 2 y 4 contienen juicios de valor («deberíamos», «es injusto»)."],["1, 3 y 4","«Es injusto» (4) es un juicio de valor: es normativa."]],
 "Positivas: describen hechos o relaciones que se pueden contrastar con datos (1, 3 y 5). Normativas: dicen qué debería ser (2 y 4).",
 "Positiva = lo que es (se contrasta con datos). Normativa = lo que debería ser (juicio de valor)."));
add(1,1,"Economía positiva y normativa",()=>CON(`En una reunión sobre el sector de software se escucharon estas afirmaciones.\n¿Cuáles son afirmaciones de economía normativa?\n1. El Estado debería dar exoneraciones a las empresas que contraten jóvenes programadores.\n2. Las exportaciones de software crecieron el último año.\n3. Las universidades deberían formar más analistas de datos.\n4. Si baja el costo del internet, más MIPYME venden en línea.\n5. Es preferible tener menos inflación aunque crezca menos el empleo.`,
 "1, 3 y 5",[["1, 2 y 3","La afirmación 2 describe un dato: es positiva."],["2, 4 y 5","Las afirmaciones 2 y 4 se pueden contrastar con datos: son positivas."],["1, 3 y 4","La afirmación 4 es una relación que se puede comprobar: es positiva."]],
 "Normativas: «debería» (1 y 3) y «es preferible» (5) expresan juicios de valor. Positivas: 2 y 4, que se contrastan con datos.",

 "Cada dólar que gasta un agente es el ingreso de otro: el gasto de los hogares es el ingreso de las empresas, y los pagos por factores son el ingreso de los hogares.","Gasto de unos = ingreso de otros."));

 "En el mercado de factores, los factores (flujo real) van de los hogares a las empresas, y los pagos (flujo monetario) van de las empresas a los hogares.","Flujo real = bienes, servicios y factores. Flujo monetario = pagos en sentido contrario."));

const TM={cp:"Competencia perfecta",cm:"Competencia monopolística",ol:"Oligopolio",mo:"Monopolio"};

add(8,6,"Tipos de mercado",()=>CON(`Relacione cada mercado con su tipo.\nMERCADOS\n1. Cientos de productores venden quintales de papa casi idénticos en el mercado mayorista de Riobamba.\n2. Una sola empresa distribuye la energía eléctrica en una provincia.\n3. Dos cerveceras grandes concentran casi todas las ventas del país.\n4. Decenas de peluquerías de Quito, cada una con su estilo, compiten por clientes.\nTIPOS\na) Competencia perfecta\nb) Competencia monopolística\nc) Oligopolio\nd) Monopolio`,
 "1a, 2d, 3c, 4b",[["1a, 2c, 3d, 4b","Intercambiaste monopolio (un vendedor) y oligopolio (pocos vendedores)."],["1b, 2d, 3c, 4a","Intercambiaste los dos tipos de competencia: la papa es homogénea; las peluquerías son diferenciadas."],["1a, 2d, 3b, 4c","Pocos vendedores grandes forman un oligopolio; muchos con productos distintos, competencia monopolística."]],
 "Muchos y homogéneos: competencia perfecta. Muchos y diferenciados: competencia monopolística. Pocos: oligopolio. Uno: monopolio.","Tipos de mercado según el número de vendedores y el tipo de producto."));
add(8,6,"Tipos de mercado",()=>CON(`Relacione cada mercado con su tipo.\nMERCADOS\n1. Una sola empresa tiene la concesión del agua potable de una ciudad.\n2. Muchas marcas de ropa deportiva, cada una con su diseño, compiten en un centro comercial.\n3. Miles de productores venden cajas de banano casi iguales a un precio que ninguno controla.\n4. Tres empresas grandes venden casi todo el cemento del país.\nTIPOS\na) Competencia perfecta\nb) Competencia monopolística\nc) Oligopolio\nd) Monopolio`,
 "1d, 2b, 3a, 4c",[["1c, 2b, 3a, 4d","Intercambiaste monopolio y oligopolio."],["1d, 2a, 3b, 4c","Intercambiaste los dos tipos de competencia: el banano es homogéneo; la ropa de marca, diferenciada."],["1d, 2c, 3a, 4b","Muchas marcas diferenciadas forman competencia monopolística; tres grandes, un oligopolio."]],
 "Uno: monopolio. Pocos: oligopolio. Muchos con productos distintos: competencia monopolística. Muchos con productos iguales: competencia perfecta.","Tipos de mercado según el número de vendedores y el tipo de producto."));

add(8,6,"Movimiento y desplazamiento de la demanda",()=>CON(`El tablero de una empresa de internet muestra que, al bajar su tarifa de $30 a $25, sus contratos nuevos pasaron de 800 a 1 000 al mes, sin otros cambios.\n¿Cómo se interpreta?`,

 "Si solo cambia el precio del bien, la cantidad demandada se mueve a lo largo de la misma curva (ley de la demanda).","Cambio del precio del bien: movimiento a lo largo de la curva. Cambio de otro factor: desplazamiento."));
add(8,6,"Movimiento y desplazamiento de la demanda",()=>CON(`El tablero de una cadena de cines muestra que en diciembre vendió 30 % más entradas que en noviembre, con el mismo precio, porque los hogares recibieron el décimo tercer sueldo.\n¿Cómo se interpreta?`,

 "Desplazan la demanda: el ingreso, si el bien es normal (1), el precio de un sustituto (3) y los gustos (5).","Determinantes de la demanda: ingreso, gustos, precios de bienes relacionados, expectativas y número de compradores."));
add(8,6,"Bienes sustitutos y complementarios",()=>CON(`Sube con fuerza el precio de las impresoras de inyección de tinta.\n¿Qué ocurre con la demanda de cartuchos de tinta?`,

 "Los complementarios se usan juntos: si sube el precio de uno, baja la demanda del otro. Con sustitutos ocurre lo contrario.","Complementarios: precio de uno sube, demanda del otro baja. Sustitutos: precio de uno sube, demanda del otro sube."));

[0,1,2].forEach(()=>add(9,7,"Cantidad de equilibrio",()=>{const M=mkt(),j=M.k===0?1:M.k-1;
 return NUM({q:intro(M)+`¿Cuál es la cantidad de equilibrio, en ${M.u}?`,ans:M.Qe,
 errs:[{v:2*M.Qe,msg:"Sumaste la cantidad demandada y la ofrecida: en el equilibrio se intercambia una sola vez esa cantidad."},{v:M.Qd[j],msg:"Esa es la cantidad demandada a otro precio, donde el mercado no está en equilibrio."},{v:M.Qs[M.k+1],msg:"Esa es la cantidad ofrecida a otro precio, donde sobra producto."},{v:M.Qs[j],msg:"Esa es la cantidad ofrecida a un precio menor, donde falta producto."}],
 unit:M.u,exp:`El equilibrio está a $${M.Pe}, donde se demandan y se ofrecen ${fmt(M.Qe)} ${M.u}.`,f:FEQ})}));
[0,1,2,3].forEach(()=>add(9,7,"Escasez y excedente",()=>{const M=mkt();let i;do{i=Math.floor(rnd()*5)}while(i===M.k);const gap=Math.abs(M.Qd[i]-M.Qs[i]),esc=M.Qd[i]>M.Qs[i];
 return NUM({q:intro(M)+`Un día el precio queda en $${M.P[i]}. ¿Qué cantidad falta o sobra a ese precio?`,ans:gap,
 errs:[{v:M.Qd[i],msg:"Esa es solo la cantidad demandada: hay que restarle la ofrecida."},{v:M.Qs[i],msg:"Esa es solo la cantidad ofrecida: hay que compararla con la demandada."},{v:M.Qe,msg:"Esa es la cantidad de equilibrio, no la diferencia a este precio."},{v:M.Qd[i]+M.Qs[i],msg:"Sumaste las cantidades: hay que restarlas."}],
 unit:M.u,exp:`A $${M.P[i]} se demandan ${fmt(M.Qd[i])} y se ofrecen ${fmt(M.Qs[i])}: hay ${esc?"escasez (exceso de demanda)":"excedente (exceso de oferta)"} de ${fmt(gap)} ${M.u}. El precio tiende a ${esc?"subir":"bajar"} hacia $${M.Pe}.`,
 f:"Escasez = cantidad demandada − cantidad ofrecida (precio bajo). Excedente = cantidad ofrecida − cantidad demandada (precio alto)."})}));
[0,1].forEach(()=>add(9,7,"Nuevo equilibrio tras un aumento de la demanda",()=>{const M=mkt();if(M.k>2)return null;const s=(M.b+M.d)*M.st,Pn=M.Pe+M.st;
 return NUM({q:intro(M)+`En temporada alta, los compradores piden ${fmt(s)} ${M.u} más a cada precio, y la oferta no cambia. ¿Cuál es el nuevo precio de equilibrio, en dólares?`,ans:Pn,
 errs:[{v:M.Pe,msg:"Ese es el equilibrio anterior: con más demanda, a ese precio ahora hay escasez."},{v:M.Pe-M.st,msg:"Con más demanda el precio sube, no baja."},{v:M.Pe+2*M.st,msg:"A ese precio, aun con la nueva demanda, sobra producto."}],
 show:x=>$(x),unit:"dólares",exp:`Se suman ${fmt(s)} a cada cantidad demandada. A $${Pn} la nueva cantidad demandada es ${fmt(M.Qd[M.k+1]+s)} y la ofrecida ${fmt(M.Qs[M.k+1])}: coinciden.`,f:FEQ+" Si la demanda aumenta, suben el precio y la cantidad."})}));

/* ---------- POSICIÓN 10: cambios en el equilibrio (12) ---------- */
function mktSVG(kind){const W=300,H=220,P="#5B2A86",O="#E87722";const L=(x1,y1,x2,y2,col,da)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2.4" ${da?'stroke-dasharray="6 4"':""}/>`;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Oferta y demanda"><line x1="30" y1="${H-25}" x2="${W-10}" y2="${H-25}" stroke="currentColor"/><line x1="30" y1="${H-25}" x2="30" y2="10" stroke="currentColor"/><text x="${W-12}" y="${H-8}" font-size="11" text-anchor="end" fill="currentColor">Cantidad</text><text x="34" y="12" font-size="11" fill="currentColor">Precio</text>`;
 s+=L(60,30,250,180,P)+L(60,170,260,60,O);
 const sh={dr:[L(100,20,280,160,P,1),"Demanda final",296,178,P,"end"],dl:[L(40,60,200,190,P,1),"Demanda final",44,52,P,"start"],or:[L(90,190,280,95,O,1),"Oferta final",296,118,O,"end"],ol:[L(40,140,230,30,O,1),"Oferta final",232,24,O,"end"]}[kind];
 return s+sh[0]+`<text x="64" y="24" font-size="11" fill="${P}">Demanda inicial</text><text x="296" y="${kind==="ol"?74:52}" font-size="11" text-anchor="end" fill="${O}">Oferta inicial</text><text x="${sh[2]}" y="${sh[3]}" font-size="11" text-anchor="${sh[5]}" fill="${sh[4]}">${sh[1]}</text></svg>`}
const NEWS={dr:["Las ferias navideñas aumentan las compras de quesos para regalos.","Sube el ingreso de los hogares, y el queso es un bien normal.","Una campaña en redes pone de moda los quesos artesanales."],dl:["Un estudio difundido en redes reduce el interés por el queso.","Baja el precio de un producto sustituto, como el yogur griego.","Cae el ingreso de los hogares, y el queso es un bien normal."],or:["Baja el precio de la leche cruda que compran las queserías.","Una nueva máquina reduce los costos de producir queso.","Abren varias queserías nuevas en la zona."],ol:["Una sequía encarece la leche cruda.","Sube el costo del gas que usan las queserías.","Se cierran varias queserías por nuevas exigencias sanitarias."]};
const EFF={dr:"Suben el precio y la cantidad.",dl:"Bajan el precio y la cantidad.",or:"Baja el precio y sube la cantidad.",ol:"Sube el precio y baja la cantidad."};
const EFFM={dr:"Eso ocurriría si aumentara la demanda.",dl:"Eso ocurriría si disminuyera la demanda.",or:"Eso ocurriría si aumentara la oferta.",ol:"Eso ocurriría si disminuyera la oferta."};
const SHN={dr:"La demanda se desplaza a la derecha",dl:"La demanda se desplaza a la izquierda",or:"La oferta se desplaza a la derecha",ol:"La oferta se desplaza a la izquierda"};
const FCH="Demanda a la derecha: suben precio y cantidad. Demanda a la izquierda: bajan ambos. Oferta a la derecha: baja el precio y sube la cantidad. Oferta a la izquierda: sube el precio y baja la cantidad.";
["dr","dl","or","ol"].forEach(k=>add(10,7,"Cambios en el equilibrio (gráfico)",()=>CON(`El gráfico muestra el mercado de queso fresco de una provincia antes (líneas continuas) y después (línea discontinua) de un cambio.\n¿Qué noticia es coherente con el gráfico?`,
 pick(NEWS[k]),Object.keys(NEWS).filter(j=>j!==k).map(j=>[pick(NEWS[j]),`Esa noticia hace que ${SHN[j].toLowerCase()}.`]),`${SHN[k]}: ${EFF[k].toLowerCase()}`,FCH,mktSVG(k))));
["dr","dl","or","ol"].forEach(k=>add(10,7,"Efecto de una noticia sobre el equilibrio",()=>CON(`En el mercado de queso fresco de una provincia ocurre lo siguiente: ${pick(NEWS[k]).replace(/^./,c=>c.toLowerCase())}\n¿Qué pasa con el precio y la cantidad de equilibrio?`,
 EFF[k],Object.keys(EFF).filter(j=>j!==k).map(j=>[EFF[j],`${EFFM[j]} ${SHN[k]}.`]),`${SHN[k]}: ${EFF[k].toLowerCase()}`,FCH)));
[0,1].forEach(()=>add(10,7,"Leer un tablero de precios",()=>{const k=pick(["dr","dl","or","ol"]);const p0=R(4,6,0.5),q0=R(800,1200,100);const up=k==="dr"||k==="ol",qup=k==="dr"||k==="or";const p1=+(p0+(up?1:-1)*R(0.5,1.5,0.5)).toFixed(2),q1=q0+(qup?1:-1)*R(100,300,50);
 return CON(`El tablero del mercado de queso fresco muestra que, en un mes, el precio del kilo pasó de $${fmt(p0,2)} a $${fmt(p1,2)} y la cantidad vendida, de ${fmt(q0)} a ${fmt(q1)} kilos diarios.\n¿Qué noticia explica mejor este cambio?`,
 pick(NEWS[k]),Object.keys(NEWS).filter(j=>j!==k).map(j=>[pick(NEWS[j]),`${EFFM[j]} Revisa en qué dirección se movieron el precio y la cantidad.`]),
 `El precio ${up?"subió":"bajó"} y la cantidad ${qup?"subió":"bajó"}: ${SHN[k].toLowerCase()}.`,FCH)}));
const SIM={"dr+or":["Sube la cantidad; el precio puede subir o bajar.","Los dos cambios aumentan la cantidad; sobre el precio se oponen."],"dr+ol":["Sube el precio; la cantidad puede subir o bajar.","Los dos cambios suben el precio; sobre la cantidad se oponen."],"dl+or":["Baja el precio; la cantidad puede subir o bajar.","Los dos cambios bajan el precio; sobre la cantidad se oponen."],"dl+ol":["Baja la cantidad; el precio puede subir o bajar.","Los dos cambios reducen la cantidad; sobre el precio se oponen."]};
[0,1].forEach(()=>add(10,7,"Cambios simultáneos",()=>{const key=pick(Object.keys(SIM));const [a,b]=key.split("+");
 return CON(`En la misma temporada, en el mercado de queso fresco: ${pick(NEWS[a]).replace(/^./,c=>c.toLowerCase())} Además, ${pick(NEWS[b]).replace(/^./,c=>c.toLowerCase())}\nSin conocer el tamaño de cada cambio, ¿qué se puede asegurar?`,
 SIM[key][0],Object.keys(SIM).filter(j=>j!==key).map(j=>[SIM[j][0],"Revisa qué hace cada cambio por separado: es seguro solo lo que ambos mueven en la misma dirección."]),
 `${SHN[a]} y ${SHN[b].toLowerCase()}. ${SIM[key][1]}`,"Con dos cambios a la vez, es seguro lo que ambos mueven en la misma dirección; lo demás depende de cuál es mayor.")}));

if(typeof module!=="undefined")module.exports={C,SLOTS,TEMAS,REPASO,CALC,fmt,near};

</script>
<script>
{
const KEY="principiosINEG_P1_entrenamiento_v1";
let S={nombre:"",curso:"",hist:[],cur:null};
try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCD";
function gen(c){let q=null,t=0;while(!q&&t<200){q=c.gen();t++}q.tema=c.tema;q.sub=c.sub;q.slot=c.slot;return q}
C.forEach(c=>{c.calc=!!gen(c).num});
function newAttempt(){const qs=SLOTS.map(s=>{const pool=C.filter(c=>c.slot===s.n&&(!CALC.includes(s.n)||c.calc));return gen(pick(pool))});S.cur={qs,i:0,ans:qs.map(()=>({num:null,choice:null,numDone:false})),start:new Date().toISOString()};save();render()}
function parseNum(v){let s=String(v).trim().replace(/[\s$% ]/g,"").replace(/−/g,"-");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const x=parseFloat(s);return isFinite(x)?x:null}
const fdate=iso=>{const d=new Date(iso);return d.toLocaleDateString("es-EC")+" "+d.toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"})};

function home(){
 const h=S.hist;
 app.innerHTML=`<div class="card"><h2>Tus datos</h2><p class="mut">Solo se usan para tu PDF. Se guardan en este navegador.</p>
 <label for="nom">Nombre y apellido</label><input id="nom" value="${esc(S.nombre)}" autocomplete="name">
 <label for="cur">Curso y paralelo</label><input id="cur" value="${esc(S.curso)}" placeholder="Ej.: Principios de Economía, 3.º Inteligencia de Negocios">
 </div>
 <div class="card"><h2>¿Qué quieres hacer?</h2>
 <p><b>Intento de 10 preguntas.</b> Una de cada bloque del parcial; siempre hay ejercicios de costo de oportunidad, de la frontera de posibilidades de producción, de utilidad y de equilibrio de mercado. Ves la retroalimentación y tu nota al final.</p>
 <div class="row"><button class="b1" id="go">${S.cur?"Continuar mi intento":"Empezar un intento"}</button></div>
 <p style="margin-top:18px"><b>Practicar un tema.</b> Preguntas sin límite del tema que elijas, con retroalimentación inmediata.</p>
 <label for="tem">Tema</label><select id="tem">${Object.entries(TEMAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <div class="row"><button class="b2" id="pr">Practicar este tema</button></div></div>
 <div class="card"><h2>Mi registro</h2>${h.length?`<table><tr><th>Intento</th><th>Fecha</th><th class="n">Nota</th></tr>${h.map((a,i)=>`<tr><td>${i+1}</td><td>${fdate(a.fecha)}</td><td class="n">${fmt(a.nota,1)} / 10</td></tr>`).join("")}</table>${refuerzo()}`:`<p class="mut">Todavía no tienes intentos terminados.</p>`}
 <div class="row"><button class="b3" id="pdf" ${h.length?"":"disabled"}>Descargar mi PDF</button></div><p class="mut" id="pmsg"></p></div>`;
 const keep=()=>{S.nombre=document.getElementById("nom").value.trim();S.curso=document.getElementById("cur").value.trim();save()};
 document.getElementById("nom").oninput=keep;document.getElementById("cur").oninput=keep;
 document.getElementById("go").onclick=()=>{keep();if(!S.nombre){alertBox("Escribe tu nombre para empezar.");return}S.cur?render():newAttempt()};
 document.getElementById("pr").onclick=()=>{keep();P={tema:+document.getElementById("tem").value,q:null,n:0,ok:0};nextPractice()};
 document.getElementById("pdf").onclick=()=>{keep();makePDF()};
}
function alertBox(t){const m=document.getElementById("pmsg")||document.createElement("p");m.textContent=t;m.className="mut";m.style.color="var(--bad)";if(!m.isConnected)app.querySelector(".card").appendChild(m)}
function temaStats(){const st={};for(const a of S.hist)for(const [t,[o,n]] of Object.entries(a.porTema)){st[t]=st[t]||[0,0];st[t][0]+=o;st[t][1]+=n}return st}
function refuerzo(){const st=temaStats();const w=Object.entries(st).filter(([t,[o,n]])=>n&&o/n<0.7).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
 return w.length?`<h3>Temas para reforzar</h3><ul>${w.map(([t,[o,n]])=>`<li>${TEMAS[t]}: ${o} de ${n} correctas. Repasa: ${REPASO[t]}.</li>`).join("")}</ul>`:`<p class="mut">Vas bien en todos los temas que has practicado.</p>`}

/* ---------- pregunta ---------- */
function qHTML(q,a,mode){
 const showOpts=!q.num||a.numDone;
 let h=`<p class="q">${esc(q.q)}</p>${q.svg?`<div class="fig">${q.svg}</div>`:""}
 <button class="info" data-f>(i) Fórmula</button><div class="formula hide" id="fx">${esc(q.f)}</div>`;
 if(q.num){h+=`<div class="numbox"><label for="nv">1. Calcula y escribe tu resultado${q.num.unit?" ("+q.num.unit+")":""}</label><p class="mut" style="margin:0">Usa coma para los decimales, sin separador de miles.</p>
 <div class="row"><input id="nv" inputmode="decimal" value="${a.num??""}" ${a.numDone?"disabled":""}><button class="b1" id="nb" ${a.numDone?"disabled":""}>Registrar</button><button class="b3" id="nx" ${a.numDone?"disabled":""}>No lo sé</button></div><div id="nfb">${a.numDone&&mode==="p"?numFB(q,a):""}</div></div>`}
 if(showOpts)h+=`<p><b>${q.num?"2. Ahora elige la opción correcta":"Elige la opción correcta"}</b></p>`+q.opts.map((o,j)=>`<button class="opt ${a.choice===j?"sel":""}" data-o="${j}"><b>${L[j]})</b>${esc(o.t)}</button>`).join("");
 return h}
function numFB(q,a){if(a.num===null)return `<p class="mut">Sin resultado registrado.</p>`;const ok=near(a.num,q.num.ans,q.num.dec);return `<p style="color:var(${ok?"--ok":"--bad"})"><b>${ok?"Tu resultado coincide.":"Tu resultado no coincide."}</b> ${ok?"":"Revisa el procedimiento al ver la retroalimentación."}</p>`}
function fbHTML(q,a){const o=q.opts[a.choice],c=q.opts.findIndex(x=>x.ok);
 return `<div class="fb ${o&&o.ok?"":"no"}">${o?(o.ok?`<p><b>Correcto.</b></p>`:`<p><b>Incorrecto.</b> ${esc(o.msg)}</p>`):`<p><b>Sin responder.</b></p>`}
 ${o&&o.ok?"":`<p><b>Respuesta correcta:</b> ${L[c]}) ${esc(q.opts[c].t)}</p>`}<p>${esc(q.exp)}</p><p class="mut">Repasa: ${REPASO[q.tema]}.</p></div>`}
function wire(q,a,onNum,onOpt){
 app.querySelector("[data-f]").onclick=()=>document.getElementById("fx").classList.toggle("hide");
 if(q.num&&!a.numDone){const reg=v=>{a.num=v;a.numDone=true;onNum()};
  document.getElementById("nb").onclick=()=>{const v=parseNum(document.getElementById("nv").value);if(v===null){document.getElementById("nfb").innerHTML=`<p class="mut">Escribe un número, o pulsa «No lo sé».</p>`;return}reg(v)};
  document.getElementById("nx").onclick=()=>reg(null)}
 app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>onOpt(+b.dataset.o))}

function render(){const A=S.cur;if(!A)return home();if(A.i>=A.qs.length)return finish();
 const q=A.qs[A.i],a=A.ans[A.i];
 app.innerHTML=`<div class="card"><span class="chip">${TEMAS[q.tema]}</span> <span class="mut">Pregunta ${A.i+1} de ${A.qs.length}</span><div class="prog"><i style="width:${A.i/A.qs.length*100}%"></i></div>${qHTML(q,a,"i")}
 <div class="row"><button class="b3" id="bk" ${A.i?"":"disabled"}>Anterior</button><button class="b1" id="nxq" ${a.choice===null?"disabled":""}>${A.i===A.qs.length-1?"Terminar y ver mi nota":"Siguiente"}</button></div>
 <div class="row"><button class="b3" id="out">Guardar y salir</button></div></div>`;
 wire(q,a,()=>{save();render()},j=>{a.choice=j;save();render()});
 document.getElementById("bk").onclick=()=>{A.i--;save();render()};
 document.getElementById("nxq").onclick=()=>{A.i++;save();render();scrollTo(0,0)};
 document.getElementById("out").onclick=()=>{save();home()}}

function finish(){const A=S.cur;const porTema={};let ok=0;const err=[];
 A.qs.forEach((q,i)=>{const a=A.ans[i],o=q.opts[a.choice],good=!!(o&&o.ok);ok+=good;porTema[q.tema]=porTema[q.tema]||[0,0];porTema[q.tema][0]+=good;porTema[q.tema][1]++;if(!good)err.push({n:i+1,tema:q.tema,sub:q.sub,msg:o?o.msg:"Sin responder."})});
 const rec={fecha:new Date().toISOString(),nota:ok,aciertos:ok,total:A.qs.length,porTema,err,qs:A.qs,ans:A.ans};
 S.hist.push(rec);S.cur=null;save();results(S.hist.length-1)}

function results(k){const r=S.hist[k];
 app.innerHTML=`<div class="card"><h2>Tu nota de práctica</h2><div class="big">${fmt(r.nota,1)}<span style="font-size:.4em;color:var(--mut)"> / 10</span></div>
 <p>Respondiste bien ${r.aciertos} de ${r.total} preguntas. ${r.nota>=7?"Buen resultado: sigue practicando para afianzarlo.":"Revisa los errores de abajo y vuelve a intentarlo: cada intento trae preguntas distintas."}</p>
 <h3>Por tema</h3>${Object.entries(r.porTema).map(([t,[o,n]])=>`<div class="bar"><span>${TEMAS[t]}</span><span>${o} de ${n}</span><div class="t"><i style="width:${o/n*100}%"></i></div></div>`).join("")}
 ${r.err.length?`<h3>Por qué perdiste puntos</h3><ul>${r.err.map(e=>`<li><b>Pregunta ${e.n} (${esc(e.sub)}):</b> ${esc(e.msg)}</li>`).join("")}</ul>`:"<p><b>¡Todas correctas!</b></p>"}
 <div class="row"><button class="b1" id="again">Nuevo intento</button><button class="b3" id="hm">Inicio y PDF</button></div></div>
 <div class="card"><h2>Revisión de cada pregunta</h2>${r.qs.map((q,i)=>{const a=r.ans[i],o=q.opts[a.choice];return `<details ${o&&o.ok?"":"open"}><summary>${i+1}. ${esc(q.sub)} · ${o&&o.ok?"✔ correcta":"✘ incorrecta"}</summary><p class="q">${esc(q.q)}</p>${q.svg?`<div class="fig">${q.svg}</div>`:""}${q.num?numFB(q,a):""}${q.opts.map((x,j)=>`<div class="opt ${x.ok?"good":(a.choice===j?"wrong":"")}"><b>${L[j]})</b>${esc(x.t)}</div>`).join("")}${fbHTML(q,a)}<p class="mut">Fórmula: ${esc(q.f)}</p></details>`}).join("")}</div>`;
 document.getElementById("again").onclick=()=>{newAttempt();scrollTo(0,0)};document.getElementById("hm").onclick=()=>{home();scrollTo(0,0)}}

/* ---------- práctica por tema ---------- */
let P=null;
function nextPractice(){const pool=C.filter(c=>c.tema===P.tema);P.q=gen(pick(pool));P.a={num:null,choice:null,numDone:false};P.done=false;showPractice();scrollTo(0,0)}
function showPractice(){const q=P.q,a=P.a;
 app.innerHTML=`<div class="card"><span class="chip">Práctica · ${TEMAS[P.tema]}</span> <span class="mut">Llevas ${P.ok} de ${P.n} correctas</span>${qHTML(q,a,"p").replace(/<button class="opt/g,P.done?'<button disabled class="opt':'<button class="opt')}
 <div id="pf">${P.done?fbHTML(q,a):""}</div>
 <div class="row">${P.done?`<button class="b1" id="pn">Otra pregunta</button>`:""}<button class="b3" id="ph">Volver al inicio</button></div></div>`;
 if(P.done){app.querySelectorAll("[data-o]").forEach((b,j)=>{const o=q.opts[j];if(o.ok)b.classList.add("good");else if(a.choice===j)b.classList.add("wrong")})}
 wire(q,a,()=>showPractice(),j=>{if(P.done)return;a.choice=j;P.done=true;P.n++;if(q.opts[j].ok)P.ok++;showPractice()});
 if(P.done)document.getElementById("pn").onclick=nextPractice;
 document.getElementById("ph").onclick=()=>{P=null;home()}}

/* ---------- PDF ---------- */
const clean=s=>String(s).replace(/ /g," ").replace(/−/g,"-").replace(/÷/g,"/").replace(/Δ/g,"var. ").replace(/≈/g,"aprox.").replace(/[₀₁₂ₜ]/g,m=>({"₀":"0","₁":"1","₂":"2","ₜ":"t"}[m])).replace(/[↑]/g," sube").replace(/[↓]/g," baja").replace(/→/g,"->").replace(/[✔✘]/g,"").replace(/Σ/g,"suma de ").replace(/π/g,"inflación ");
function makePDF(){const msg=document.getElementById("pmsg");
 if(!window.jspdf){msg.textContent="No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a intentarlo.";return}
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"});let y=18;const W=180;
 const line=(t,o={})=>{d.setFont("helvetica",o.b?"bold":"normal");d.setFontSize(o.s||10.5);const ls=d.splitTextToSize(clean(t),W);for(const l of ls){if(y>282){d.addPage();y=18}d.text(l,15,y);y+=(o.s||10.5)*0.45}y+=o.gap??1.5};
 d.setFillColor(91,42,134);d.rect(0,0,210,10,"F");
 line("Entrenamiento para el Parcial 1 · Principios de Economía (Inteligencia de Negocios)",{b:1,s:15,gap:3});
 line(`Estudiante: ${S.nombre||"(sin nombre)"}`);line(`Curso: ${S.curso||"(sin curso)"}`);line(`Fecha de descarga: ${fdate(new Date().toISOString())}`,{gap:2});
 line("Nota de práctica: no cuenta para la calificación. Sirve para identificar qué temas reforzar antes de la prueba.",{s:9.5,gap:4});
 line("Intentos",{b:1,s:12});S.hist.forEach((a,i)=>line(`Intento ${i+1} · ${fdate(a.fecha)} · Nota: ${fmt(a.nota,1)} / 10 (${a.aciertos} de ${a.total})`));
 y+=2;line("Aciertos acumulados por tema",{b:1,s:12});const st=temaStats();for(const [t,[o,n]] of Object.entries(st))line(`${TEMAS[t]}: ${o} de ${n} (${fmt(o/n*100,0)} %)`);
 y+=2;line("Temas para reforzar",{b:1,s:12});const w=Object.entries(st).filter(([t,[o,n]])=>o/n<0.7);if(w.length)w.forEach(([t])=>line(`${TEMAS[t]}. Repasar: ${REPASO[t]}.`));else line("Ninguno: más de 70 % de aciertos en todos los temas practicados.");
 const r=S.hist[S.hist.length-1];y+=2;line(`Detalle del último intento (nota ${fmt(r.nota,1)} / 10)`,{b:1,s:12});
 r.qs.forEach((q,i)=>{const a=r.ans[i],o=q.opts[a.choice];line(`${i+1}. ${TEMAS[q.tema]} - ${q.sub}: ${o&&o.ok?"correcta":"incorrecta"}`,{b:1,s:10});if(!(o&&o.ok)){line(`Error: ${o?o.msg:"sin responder"}`,{s:9.5,gap:0.5});line(`Explicación: ${q.exp}`,{s:9.5})}});
 const n=(S.nombre||"estudiante").replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,"").trim().replace(/\s+/g,"_");
 try{d.save(`Entrenamiento_Principios_INEG_P1_${n}.pdf`);msg.textContent="PDF descargado."}catch(e){msg.textContent="Este visor no permite descargas. Abre el enlace en tu navegador."}}

render();
}
